name: Android Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Remove local Android Studio JVM preference
        run: rm -f gradle/gradle-daemon-jvm.properties

      - name: Parse release version
        id: version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo 'Release tags must use vMAJOR.MINOR.PATCH' >&2
            exit 1
          fi
          major=$((10#${BASH_REMATCH[1]}))
          minor=$((10#${BASH_REMATCH[2]}))
          patch=$((10#${BASH_REMATCH[3]}))
          if (( minor > 999 || patch > 999 )); then
            echo 'MINOR and PATCH must be below 1000' >&2
            exit 1
          fi
          code=$((major * 1000000 + minor * 1000 + patch))
          if (( code < 2 || code > 2100000000 )); then
            echo 'Version code is outside the supported range' >&2
            exit 1
          fi
          echo "name=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Test and build unsigned release APK
        run: gradle testDebugUnitTest assembleRelease -PreleaseVersionCode=${{ steps.version.outputs.code }} -PreleaseVersionName=${{ steps.version.outputs.name }} --stacktrace

      - name: Sign and verify release APK
        shell: bash
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$SIGNING_KEYSTORE_BASE64" || -z "$SIGNING_PASSWORD" ]]; then
            echo 'Release signing secrets are missing' >&2
            exit 1
          fi
          keystore="$RUNNER_TEMP/owetrack-release.p12"
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          tools="$ANDROID_HOME/build-tools/35.0.0"
          unsigned='app/build/outputs/apk/release/app-release-unsigned.apk'
          aligned="$RUNNER_TEMP/owetrack-aligned.apk"
          output="OweTrack-v${{ steps.version.outputs.name }}.apk"
          "$tools/zipalign" -f 4 "$unsigned" "$aligned"
          "$tools/apksigner" sign \
            --ks "$keystore" --ks-type PKCS12 --ks-key-alias owetrack \
            --ks-pass env:SIGNING_PASSWORD --key-pass env:SIGNING_PASSWORD \
            --out "$output" "$aligned"
          "$tools/apksigner" verify --verbose "$output"
          sha256sum "$output" > "$output.sha256"

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/release-notes.txt" <<'NOTES'
          Download the APK below to install OweTrack.

          If your installed copy came from an Actions debug build, first use Settings > Create full backup and keep the JSON file. The release uses a different signing key, so Android cannot install it over that debug copy. After backing up, uninstall the debug copy, install this release, then restore the JSON file in Settings.
          NOTES
          gh release create "$GITHUB_REF_NAME" \
            "OweTrack-v${{ steps.version.outputs.name }}.apk" \
            "OweTrack-v${{ steps.version.outputs.name }}.apk.sha256" \
            --verify-tag --title "OweTrack ${{ steps.version.outputs.name }}" \
            --notes-file "$RUNNER_TEMP/release-notes.txt"
